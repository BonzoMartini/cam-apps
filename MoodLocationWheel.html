<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mood Location Wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Single dark stage: wheel centred, fixed pointer at 12 o'clock, result as full-screen card */
:root{
  --bg:#12100f; --fg:#efe7dc; --dim:#8c8378;
  --loc:#d9a441; --mood:#6fa3b8; --pin:#e8553b;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--label);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;gap:32px;user-select:none}
#stage{display:flex;flex-direction:column;align-items:center;gap:14px}
#log{width:230px;max-height:82vh;display:flex;flex-direction:column;gap:10px;min-width:0}
#log h2{margin:0;font:600 13px var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#hl{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#hl li{display:flex;flex-direction:column;line-height:1.1;padding-bottom:8px;border-bottom:1px solid #2a2622}
#hl li:first-child .m{font-size:20px}#hl li:first-child .l{font-size:24px}
#hl .m{color:var(--mood);font:600 16px var(--label)}#hl .l{color:var(--loc);font:800 19px var(--display)}
#hl .e{color:var(--dim);font-size:14px;border:0}
#clr{align-self:flex-start;background:transparent;color:var(--dim);border:1px solid #3a352f;padding:5px 12px;font-size:12px}
@media (max-width:760px){html,body{height:auto}body{flex-direction:column;overflow:auto;padding-block:16px}#log{width:100%;max-height:none}}
#wrap{position:relative;touch-action:none}
canvas{display:block;cursor:grab}
canvas:active{cursor:grabbing}
#live{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;pointer-events:none;text-align:center;
  font-family:var(--display);font-weight:800;text-shadow:0 0 18px var(--bg),0 0 6px var(--bg),0 2px 2px var(--bg)}
#lm{font-size:clamp(30px,7vw,84px);line-height:1;color:var(--mood)}
#ll{font-size:clamp(36px,8.5vw,104px);line-height:1;color:var(--loc)}
#bar{display:flex;gap:18px;align-items:center;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
#bar b{color:var(--loc);font-weight:600}#bar i{color:var(--mood);font-style:normal;font-weight:600}
button{font:600 15px var(--label);letter-spacing:.12em;text-transform:uppercase;background:var(--fg);color:var(--bg);border:0;padding:9px 20px;border-radius:2px;cursor:pointer}
button:focus-visible{outline:2px solid var(--pin);outline-offset:3px}
#ver{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--dim);letter-spacing:.1em}
#res{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;cursor:pointer;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#res .k{font-size:clamp(13px,1.6vw,18px);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
#res .m{font:800 clamp(40px,10vw,150px)/.95 var(--display);color:var(--mood);text-wrap:balance}
#res .l{font:800 clamp(48px,13vw,200px)/.9 var(--display);color:var(--loc);text-wrap:balance}
#res .h{margin-top:3vh;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#res:not([hidden]) .m,#res:not([hidden]) .l{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
#res:not([hidden]) .l{animation-delay:.12s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){#res .m,#res .l{animation:none!important}}
</style>

<div id="stage">
<div id="wrap"><canvas id="c" aria-label="Spinner wheel: drag to spin"></canvas>
<div id="live" hidden><div id="lm"></div><div id="ll"></div></div></div>
<div id="bar"><span>Inner <b>location</b></span><button id="go">Spin</button><span>Outer <i>mood</i></span></div>
</div>
<aside id="log"><h2>Previous spins</h2><ol id="hl"></ol><button id="clr">Clear</button></aside>
<div id="ver">v2.3</div>
<div id="res" hidden><div class="k">mood</div><div class="m" id="rm"></div><div class="k">location</div><div class="l" id="rl"></div><div class="h">click to close</div></div>

<script>
const LOC=`café station observatory tower amphitheatre library square glasshouse garden dome hall dock skybridge platform outpost vault arcade factory monastery ring lighthouse bazaar theatre temple colony plaza grove scrapyard fortress caravan well ossuary pier starport tavern palace courtyard windmill hangar crypt grotto oasis canal village maze citadel ruin chamber bridge bunker staircase fairground railway market cavern orbital moon rooftop spire crater labyrinth monorail airship tree kitchen`.split(' ');
const MOOD=["brutalist","baroque","gothic","rococo","neoclassical","art deco","organic","fractal","modular","Hive Mind","labyrinthine","crystalline","skeletal","cavernous","monolithic","tessellated","biomorphic","surreal","whimsical","cozy","eerie","mythic","eldritch","nostalgic","melancholic","utopian","dystopian","pastoral","idyllic","romantic","dreamlike","ominous","psychedelic","decadent","timeless","uncanny","sacred","cyberpunk","steampunk","solarpunk","biopunk","clockpunk","post-apocalyptic","SciFi","mythpunk","dark fantasy","sword & sorcery","heroic","slipstream","volcanic","glacial","desert","jungle","marshland","oceanic","subterranean","floating","aerial","underwater","stellar","planetary","asteroid","fungal","overgrown","storm-swept","tidal","hollow","bone","obsidian","glass","iron","brass","rusty","luminous","phosphorescent","translucent","mossy","carved","polished","molten","woven","jagged","iridescent","shifting","petrified","root-bound","shadowed","Wes Anderson","Ghibli","Lovecraftian","Dark Souls","cozy-core","vaporwave","folk-horror","clock","undersea","archive","neon","abandoned","cliffside","spice","dream","ice","whispering","cloud","puppet","candlelit","ruined","data","hidden","crystal","mirage","storm","coral","echo","infinity","painted","aurora","spiral","phantom","drowned"];

const TAU=Math.PI*2, FR=.28, DRAG=.03; // low friction + small constant drag = heavy wheel
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const hist={outer:[],inner:[]};
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const wheels={
  outer:{items:MOOD,r0:.6,r1:.985,hue:'--mood',rot:0,v:0,snap:false,last:-1,img:null},
  inner:{items:LOC,r0:.13,r1:.585,hue:'--loc',rot:0,v:0,snap:false,last:-1,img:null}
};
let S=0,R=0,dpr=1,flap=0,spinning=false;

function layout(){
  const wide=innerWidth>760;
  S=Math.floor(Math.min(innerWidth-32-(wide?262:0),wide?innerHeight-90:innerHeight*.75,860));
  dpr=devicePixelRatio||1; R=S/2-14;
  cv.width=cv.height=S*dpr; cv.style.width=cv.style.height=S+'px';
  for(const w of Object.values(wheels)) w.img=bake(w);
  draw();
}
function bake(w){
  const c=document.createElement('canvas'),d=Math.ceil(2*R*dpr);c.width=c.height=d;
  const g=c.getContext('2d');g.scale(dpr,dpr);g.translate(R,R);
  const n=w.items.length,s=TAU/n,base=css(w.hue),bg=css('--bg'),fg=css('--fg');
  const a=R*w.r0,b=R*w.r1;
  for(let i=0;i<n;i++){
    const t0=i*s-Math.PI/2,t1=t0+s;
    g.beginPath();g.arc(0,0,b,t0,t1);g.arc(0,0,a,t1,t0,true);g.closePath();
    g.fillStyle=base;g.globalAlpha=[.95,.62,.8,.48][i%4];g.fill();g.globalAlpha=1;
    g.strokeStyle=bg;g.lineWidth=1;g.stroke();
    g.save();g.rotate(t0+s/2);
    const band=b-a-14, arcW=s*(a+b)/2;
    let fs=Math.min(arcW*.78,R*.05);g.font=`600 ${fs}px ${css('--label')}`;
    const lab=cap(w.items[i]),tw=g.measureText(lab).width;
    if(tw>band){fs*=band/tw;g.font=`600 ${fs}px ${css('--label')}`}
    g.fillStyle=bg;g.textAlign='right';g.textBaseline='middle';
    g.fillText(lab,b-8,0);g.restore();
  }
  return c;
}
function idx(w){const n=w.items.length,s=TAU/n,a=((-w.rot)%TAU+TAU)%TAU;return Math.floor(a/s)%n}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
  const cx=S/2,cy=S/2+6;
  for(const k of ['outer','inner']){const w=wheels[k];
    ctx.save();ctx.translate(cx,cy);ctx.rotate(w.rot);ctx.drawImage(w.img,-R,-R,2*R,2*R);ctx.restore();}
  // hub
  ctx.beginPath();ctx.arc(cx,cy,R*.12,0,TAU);ctx.fillStyle=css('--bg');ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,R*.04,0,TAU);ctx.fillStyle=css('--pin');ctx.fill();
  // selection window line
  ctx.strokeStyle=css('--fg');ctx.lineWidth=1.5;ctx.globalAlpha=.55;
  ctx.beginPath();ctx.moveTo(cx,cy-R*.13);ctx.lineTo(cx,cy-R*.985);ctx.stroke();ctx.globalAlpha=1;
  // pointer flapper
  ctx.save();ctx.translate(cx,cy-R-2);ctx.rotate(flap);
  ctx.beginPath();ctx.moveTo(-11,-10);ctx.lineTo(11,-10);ctx.lineTo(0,16);ctx.closePath();
  ctx.fillStyle=css('--pin');ctx.fill();ctx.restore();
}

let ac,noise,lastClick=0;
function audioOn(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
  const n=Math.floor(ac.sampleRate*.006);noise=ac.createBuffer(1,n,ac.sampleRate);const d=noise.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,8)}
  if(ac.state==='suspended')ac.resume()}catch(e){}}
function click(pitch){if(!ac||ac.state!=='running')return;const t=ac.currentTime;if(t-lastClick<.012)return;lastClick=t;
  try{const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=noise;f.type='bandpass';f.frequency.value=pitch*2;f.Q.value=2;g.gain.value=1.4;
  src.connect(f).connect(g).connect(ac.destination);src.start(t);
  const o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.setValueAtTime(pitch,t);
  o.frequency.exponentialRampToValueAtTime(pitch*.6,t+.03);
  og.gain.setValueAtTime(.5,t);og.gain.exponentialRampToValueAtTime(.0001,t+.035);
  o.connect(og).connect(ac.destination);o.start(t);o.stop(t+.04)}catch(e){}}

function step(w,dt){
  if(w.snap){w.rot+=(w.target-w.rot)*Math.min(1,dt*2.2);if(Math.abs(w.target-w.rot)<1e-4){w.rot=w.target;w.snap=false}}
  else if(w.v){w.rot+=w.v*dt;const sv=Math.sign(w.v),fr=FR+.022*Math.abs(w.v); // speed-dependent: sheds fast spin, long gentle tail
    w.v*=Math.exp(-fr*dt);w.v-=sv*DRAG*dt;if(Math.sign(w.v)!==sv)w.v=sv*.01;
    if(Math.abs(w.v)<.07){const dir=Math.sign(w.v)||1;w.v=0;w.snap=true;const n=w.items.length,s=TAU/n,h=hist[w===wheels.outer?'outer':'inner'];
      let i=idx(w);for(let k=0;k<n&&h.includes(i);k++)i=((i-dir)%n+n)%n;
      let d=(-(i+.5)*s-w.rot)%TAU;d=((d+Math.PI)%TAU+TAU)%TAU-Math.PI;w.target=w.rot+d}}
  const i=idx(w);if(i!==w.last){if(w.last>=0&&(w.v||w.snap)){flap=-.5*Math.sign(w.v||1);click(w===wheels.inner?520:340);live()}w.last=i}
}
let prev=performance.now();
function loop(t){const dt=Math.min(.05,(t-prev)/1000);prev=t;
  step(wheels.outer,dt);step(wheels.inner,dt);flap*=Math.exp(-14*dt);draw();
  const busy=Object.values(wheels).some(w=>w.v||w.snap);
  if(spinning&&!busy&&!drag){spinning=false;setTimeout(show,350)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function launch(main,v,raw){
  const other=main===wheels.outer?wheels.inner:wheels.outer;
  if(!raw){const sgn=Math.sign(v)||1;v=sgn*Math.min(40,Math.max(9+Math.random()*4,Math.abs(v)))}
  main.v=v;main.snap=false;other.v=-v*(.65+Math.random()*.5);other.snap=false;spinning=true;
  live();LV.hidden=false;
  document.getElementById('res').hidden=true;
}
const LV=document.getElementById('live'),LM=document.getElementById('lm'),LL=document.getElementById('ll');
function live(){LM.textContent=cap(MOOD[idx(wheels.outer)]);LL.textContent=cap(LOC[idx(wheels.inner)])}
function tada(){if(!ac||ac.state!=='running')return;const t0=ac.currentTime+.02;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(ac.destination);
  const hit=(fr,start,len,peak)=>fr.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain(),vib=ac.createOscillator(),vg=ac.createGain();
    o.type='sawtooth';o.frequency.value=f;vib.frequency.value=5.5;vg.gain.value=len>.5?f*.012:0;vib.connect(vg).connect(o.frequency);
    g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(peak,start+.02);
    g.gain.setValueAtTime(peak,start+len*.6);g.gain.exponentialRampToValueAtTime(.0001,start+len);
    o.connect(g).connect(lp);o.start(start);vib.start(start);o.stop(start+len+.05);vib.stop(start+len+.05)});
  hit([392,494,587],t0,.16,.07);            // Taa
  hit([523,659,784,1047],t0+.2,1.6,.065);  // Daaaa!
}
function show(){LV.hidden=true;tada();
  const mo=idx(wheels.outer),lo=idx(wheels.inner);
  hist.outer.push(mo);hist.inner.push(lo);
  for(const k in hist)while(hist[k].length>10)hist[k].shift();
  document.getElementById('rm').textContent=cap(MOOD[mo]);
  document.getElementById('rl').textContent=cap(LOC[lo]);
  past.unshift([cap(MOOD[mo]),cap(LOC[lo])]);past=past.slice(0,50);savePast();renderPast();
  document.getElementById('res').hidden=false;
}

// drag
let drag=null;
const ang=e=>{const r=cv.getBoundingClientRect();return Math.atan2(e.clientY-r.top-S/2-6,e.clientX-r.left-S/2)};
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),d=Math.hypot(e.clientX-r.left-S/2,e.clientY-r.top-S/2-6)/R;
  if(d>1.02)return;audioOn();
  const w=d>wheels.inner.r1?wheels.outer:wheels.inner;
  w.v=0;w.snap=false;cv.setPointerCapture(e.pointerId);
  drag={w,a:ang(e),samples:[[performance.now(),0]],tot:0};
});
cv.addEventListener('pointermove',e=>{if(!drag)return;
  const a=ang(e);let d=a-drag.a;d=((d+Math.PI)%TAU+TAU)%TAU-Math.PI;drag.a=a;
  drag.w.rot+=d;drag.tot+=d;const t=performance.now();drag.samples.push([t,drag.tot]);
  while(drag.samples.length>2&&t-drag.samples[0][0]>90)drag.samples.shift();});
function release(){if(!drag)return;const w=drag.w,tot=drag.tot;drag=null;
  // force = total drag distance from press to release (radians)
  const sgn=Math.sign(tot)||(Math.random()<.5?-1:1);
  const d=Math.abs(tot);launch(w,sgn*Math.min(40,1.2*d+0.9*d*d),true)}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

document.getElementById('go').onclick=()=>audioOn()||launch(wheels.outer,(Math.random()<.5?-1:1)*(14+Math.random()*10));
document.getElementById('res').onclick=()=>document.getElementById('res').hidden=true;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('go').click()}
  if(e.key==='Escape')document.getElementById('res').hidden=true});
let past=[];try{past=JSON.parse(localStorage.getItem('mlw-past')||'[]')}catch(e){}
function savePast(){try{localStorage.setItem('mlw-past',JSON.stringify(past))}catch(e){}}
function renderPast(){const hl=document.getElementById('hl');hl.innerHTML='';
  if(!past.length){const li=document.createElement('li');li.className='e';li.textContent='Spins will appear here.';hl.append(li);return}
  for(const [m,l] of past){const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');
    a.className='m';a.textContent=m;b.className='l';b.textContent=l;li.append(a,b);hl.append(li)}}
document.getElementById('clr').onclick=()=>{past=[];savePast();renderPast()};
renderPast();
addEventListener('resize',layout);
document.fonts.ready.then(layout);layout();
</script>

</body></html>
